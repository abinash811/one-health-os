<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMR Billing — visual prototype</title>
<style>
:root{--brand:#4682B4;--brand-dark:#3a6fa0;--brand-subtle:#eaf2f9;--side:#1a2332;--page:#f8fafc;--line:#e5e7eb;--t:#111827;--t2:#4b5563;--t3:#9ca3af;--green:#15803d;--greenbg:#f0fdf4;--amber:#b45309;--amberbg:#fffbeb;--red:#b91c1c;--redbg:#fef2f2;--purple:#7e22ce;--purplebg:#faf5ff;--blue:#1d4ed8;--bluebg:#eff6ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--t);background:#e9edf2;font-size:14px}
.proto{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.proto b{margin-right:8px}.proto button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--t2)}
.proto button.on{background:var(--side);color:#fff;border-color:var(--side)}
.stage{padding:16px;display:flex;justify-content:center}
.frame{width:1280px;max-width:100%;height:760px;background:var(--page);border-radius:10px;overflow:hidden;display:flex;box-shadow:0 8px 30px rgba(0,0,0,.15);position:relative}
.side{width:200px;background:var(--side);color:#d1d5db;padding:0;flex:none;display:flex;flex-direction:column}
.logo{height:56px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:8px;padding:0 12px;color:#fff;font-weight:700}
.logo i{width:28px;height:28px;border-radius:6px;background:var(--brand);display:block}
.grp{font-size:10px;letter-spacing:.08em;color:#6b7280;padding:14px 12px 4px}.item{margin:2px 8px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500}.item.on{background:rgba(70,130,180,.25);color:#fff}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.head{background:#fff;border-bottom:1px solid var(--line);padding:14px 32px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.head h1{margin:0;font-size:20px}.head small{display:block;color:var(--t2);font-size:12px;margin-top:2px}
.body{padding:20px 32px;overflow:auto;flex:1}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:-4px 0 16px}.tabs span{padding:10px 0;color:var(--t2);font-size:13.5px}.tabs .on{color:var(--brand);border-bottom:2px solid var(--brand);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--t);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.p:hover{background:var(--brand-dark)}.btn.sm{padding:5px 10px;font-size:12px}.btn.g{background:transparent;border-color:transparent;color:var(--t2)}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.pad{padding:16px}table{width:100%;border-collapse:collapse}th{background:#f9fafb;text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--t2);padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:11px 14px;border-bottom:1px solid #f1f5f9;font-size:13px;vertical-align:middle}tr:last-child td{border-bottom:0}.r{text-align:right}.mono{font-family:ui-monospace,Menlo,monospace}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.b-green{background:var(--greenbg);color:var(--green)}.b-amber{background:var(--amberbg);color:var(--amber)}.b-red{background:var(--redbg);color:var(--red)}.b-purple{background:var(--purplebg);color:var(--purple)}.b-blue{background:var(--bluebg);color:var(--blue)}.b-gray{background:#f3f4f6;color:var(--t2)}
.chips{display:flex;gap:8px;margin-bottom:14px;align-items:center}.pill{padding:5px 12px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:600;color:var(--t2)}.pill.on{background:var(--side);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{padding:14px 16px}.stat p{margin:0;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t2)}.stat h3{margin:6px 0 0;font-size:22px}.stat em{font-style:normal;font-size:12px;color:var(--t2)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t2);margin-bottom:6px;display:block}
.note{background:var(--brand-subtle);border:1px solid #cfe1f1;color:#1e4668;border-radius:8px;padding:10px 14px;font-size:12.5px;line-height:1.5;margin-bottom:14px}
.callout{position:absolute;z-index:20;background:#111827;color:#fff;font-size:12px;line-height:1.45;padding:9px 12px;border-radius:8px;max-width:250px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.callout:before{content:"";position:absolute;width:10px;height:10px;background:#111827;transform:rotate(45deg)}
.callout.n:before{display:none}
.callout.l:before{left:-5px;top:14px}.callout.t:before{top:-5px;left:20px}.callout.b:before{bottom:-5px;left:20px}.callout.rr:before{right:-5px;top:14px}
.nw td{white-space:nowrap}
.scr{display:none}.scr.on{display:block}
.overlay{position:absolute;inset:0;background:rgba(17,24,39,.5);display:flex;align-items:center;justify-content:center;z-index:10}
.modal{background:#fff;border-radius:12px;width:520px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}.modal h2{margin:0 0 4px;font-size:17px}
.field{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sum{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}.sum.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:15px}
.flow{display:grid;grid-template-columns:1.05fr 70px 1.2fr 70px 1fr 70px 1fr;gap:0;align-items:stretch;margin-top:8px}
.node{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 14px}.node h4{margin:0 0 4px;font-size:13px}.node p{margin:0;font-size:12px;color:var(--t2);line-height:1.45}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--brand);font-size:11px;font-weight:700;text-align:center;flex-direction:column}.arrow span{font-size:22px;line-height:1}
.srcs{display:flex;flex-direction:column;gap:8px}.src{border-left:4px solid var(--brand);background:#fff;border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:9px 12px}.src b{font-size:13px}.src p{margin:2px 0 0;font-size:11.5px;color:var(--t2)}
.src.soon{border-left-color:#d1d5db;opacity:.75}.src.ph{border-left-color:#7e22ce}.src.ipd{border-left-color:#b45309}
.paper{background:#fff;width:640px;margin:0 auto;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.08);padding:38px 42px;min-height:640px}
.paper h1{margin:0;font-size:22px}.paper hr{border:0;border-top:2px solid #111;margin:12px 0}.paper table th{background:#fff;border-bottom:1px solid #999}.paper td{padding:8px 6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--t2);margin-bottom:12px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
</style></head><body>
<div class="proto"><b>EMR Billing — visual prototype</b>
<button data-go="0" class="on">0 · How it fits together</button><button data-go="1">1 · Queue: fee appears</button><button data-go="2">2 · Patient's complete bill</button><button data-go="3">3 · Collect payment</button><button data-go="4">4 · Invoice / receipt</button><button data-go="5">5 · Pharmacist bills at counter</button><button data-go="6">6 · Billing desk: Pending bills</button><button data-go="7">7 · IPD later: same bill grows</button>
<span style="margin-left:auto;font-size:12px;color:var(--t3)">Mock-up only — nothing is built yet</span></div>
<div class="stage"><div class="frame" id="frame"></div></div>
<script>
const sidePh=()=>`<aside class="side"><div class="logo"><i></i><div>PharmaCare<div style="font-size:10px;color:#9ca3af;font-weight:400">v1.0</div></div></div>
<div class="grp">DAILY OPS</div><div class="item">Dashboard</div><div class="item">Billing</div><div class="item on">Prescriptions <span class="badge b-red" style="font-size:9px">2</span></div><div class="item">Inventory</div><div class="item">Purchases</div>
<div class="grp">RELATIONSHIPS</div><div class="item">Customers</div><div class="item">Suppliers</div><div class="grp">COMPLIANCE</div><div class="item">Sch H1 Register</div></aside>`;
const side=(on)=>`<aside class="side"><div class="logo"><i></i><div>PharmaCare<div style="font-size:10px;color:#9ca3af;font-weight:400">v1.0</div></div></div>
<div class="grp">CLINIC</div><div class="item ${on==='q'?'on':''}">Appointments</div><div class="item ${on==='p'?'on':''}">Patients</div><div class="item ${on==='b'?'on':''}">Billing (Clinic)</div><div class="item">Admissions <span class="badge b-gray" style="font-size:9px">soon</span></div>
<div class="grp">ADMIN</div><div class="item">Settings</div><div class="item">Team</div></aside>`;
const head=(t,s,a='')=>`<div class="head"><div><h1>${t}</h1>${s?`<small>${s}</small>`:''}</div><div style="display:flex;gap:8px">${a}</div></div>`;
const tabs=(on)=>`<div class="tabs">${['Appointments','Patients','Doctor Schedules','Billing','Settings'].map(x=>`<span class="${x===on?'on':''}">${x}</span>`).join('')}</div>`;
const S=[];
// 0 — how it fits
S[0]=`<div class="main">${head('How billing fits together','One patient account · every module adds charges · one complete bill')}<div class="body">
<div class="note"><b>The idea (same shape as Open Healthcare Network):</b> a patient has ONE account. Whenever anything is done for them — a consultation, a lab test, medicines, a bed — that module drops a <b>charge</b> onto the account. At any time you can see the complete bill, turn chosen charges into an <b>invoice</b>, and take <b>payment</b>.</div>
<div class="flow"><div class="srcs"><span class="lbl">Modules add charges (via API)</span>
<div class="src"><b>EMR · Consultation</b><p>₹500 fee, added automatically when the visit starts</p></div>
<div class="src soon"><b>Lab module (later)</b><p>CBC ₹350, ECG ₹200… posts the same way</p></div>
<div class="src ph"><b>Pharmacy module</b><p>Medicines dispensed against the Rx post here</p></div>
<div class="src ipd"><b>IPD module</b><p>Bed per day, nursing, OT, visits</p></div></div>
<div class="arrow"><span>→</span>post charge<br>(API)</div>
<div class="node" style="border-color:var(--brand);background:var(--brand-subtle)"><h4>Patient account</h4><p>Every charge for this patient, tagged with <b>where it came from</b> and <b>which visit / admission</b>.<br><br>Shows: gross, discount, paid, <b>balance</b>.</p></div>
<div class="arrow"><span>→</span>select<br>charges</div>
<div class="node"><h4>Invoice</h4><p>Bundles chosen charges, numbered (INV-000012). A frozen copy — later edits can't change it.</p></div>
<div class="arrow"><span>→</span>pay</div>
<div class="node"><h4>Payment</h4><p>Cash / UPI / card, part-payments allowed, receipt printed. Advance deposits for IPD.</p></div></div>
<div class="card pad" style="margin-top:18px"><b>Why this matters for you</b><ul style="margin:8px 0 0;padding-left:18px;line-height:1.7;color:var(--t2)"><li><b>Complete bill, always:</b> OPD today, pharmacy and IPD tomorrow — nothing to rebuild, they just post more charges.</li><li><b>Every counter bills its own charges:</b> the pharmacist dispenses, invoices and collects right at the pharmacy; the front desk collects the consultation; the lab collects its tests. <b>The billing desk</b> sees everything — complete bills and a <b>Pending</b> list — and can collect whatever is left.</li><li><b>Modules stay separate:</b> each module only talks to the account through the API (our product rule). A pharmacy-only customer can still post charges from any EMR.</li><li><b>Money in integer paise</b>, soft-deleted, every change in the Audit Log.</li></ul></div>
</div></div>`;
// 1 — queue
S[1]=`${side('q')}<div class="main">${head('Clinic','',`<button class="btn p">+ Book Appointment</button>`)}<div class="body">${tabs('Appointments')}
<div class="stats"><div class="card stat"><p>Waiting</p><h3>3</h3></div><div class="card stat"><p>In consult</p><h3>1</h3></div><div class="card stat"><p>Done today</p><h3>4</h3></div><div class="card stat" style="border-color:var(--brand);background:var(--brand-subtle)"><p>Collected today</p><h3>₹4,500</h3><em>9 fees · 1 unpaid</em></div></div>
<div class="card"><table><thead><tr><th>Token</th><th>Patient</th><th>Doctor</th><th>Status</th><th>Fee</th><th class="r">Next step</th></tr></thead><tbody>
<tr style="background:#f8fbfe"><td class="mono"><b>#1</b></td><td><b>Asha Menon</b></td><td>Dr Meera Rao</td><td><span class="badge b-purple">In Consult</span></td><td><span class="badge b-amber">₹500 · Unpaid</span></td><td class="r"><button class="btn sm">Write Rx</button> <button class="btn sm p" data-go="3">Collect ₹500</button></td></tr>
<tr><td class="mono"><b>#2</b></td><td>Ravi Kumar</td><td>Dr Meera Rao</td><td><span class="badge b-amber">Checked In</span></td><td><span class="badge b-green">₹500 · Paid (UPI)</span></td><td class="r"><button class="btn sm">Start consult</button></td></tr>
<tr><td class="mono"><b>#3</b></td><td>Sunita Rao</td><td>Dr Meera Rao</td><td><span class="badge b-blue">Booked</span></td><td><span class="badge b-gray">— not yet</span></td><td class="r"><button class="btn sm">Check in</button></td></tr>
<tr><td class="mono"><b>#4</b></td><td>Imran Sheikh</td><td>Dr Meera Rao</td><td><span class="badge b-green">Completed</span></td><td><span class="badge b-green">₹500 · Paid (Cash)</span></td><td class="r"><button class="btn sm g">View bill</button></td></tr></tbody></table></div>
<div class="callout n" style="left:232px;top:520px;max-width:330px">① Row #1: the ₹500 consultation <b>charge is added automatically</b> when the visit starts (fee comes from the doctor's profile). The receptionist just taps <b>Collect</b>.</div>
<div class="callout n" style="left:590px;top:520px;max-width:330px">② The <b>Collected today</b> card gives the front desk the day total — no spreadsheet at closing time.</div>
</div></div>`;
// 2 — patient bill
const row=(c,d,svc,sub,src,cls,q,amt,st,stc)=>`<tr><td><input type="checkbox" ${c?'checked':''}></td><td>${d}</td><td><b>${svc}</b><div style="font-size:11.5px;color:var(--t2)">${sub}</div></td><td><span class="badge ${cls}">${src}</span></td><td class="r">${q}</td><td class="r"><b>${amt}</b></td><td><span class="badge ${stc}">${st}</span></td></tr>`;
S[2]=`${side('p')}<div class="main">${head('Asha Menon','UHID SUN-000001 · 41 yrs · Female · Allergies: Penicillin',`<button class="btn">+ Add charge</button><button class="btn p" data-go="4">Create invoice (3 selected)</button>`)}<div class="body">
<div class="tabs"><span>Overview</span><span>Visits</span><span class="on">Billing</span></div>
<div class="stats"><div class="card stat"><p>Total charges</p><h3>₹1,036</h3><em>5 items</em></div><div class="card stat"><p>Paid</p><h3 style="color:var(--green)">₹500</h3><em>1 receipt</em></div><div class="card stat" style="border-color:#fcd34d;background:var(--amberbg)"><p>Balance due</p><h3 style="color:var(--amber)">₹536.40</h3><em>unpaid charges</em></div><div class="card stat"><p>Advance held</p><h3>₹0</h3><em>for IPD later</em></div></div>
<div class="legend"><span><i style="background:var(--brand)"></i>EMR</span><span><i style="background:var(--purple)"></i>Pharmacy</span><span><i style="background:#b45309"></i>IPD (later)</span><span style="margin-left:auto">Tick charges → Create invoice</span></div>
<div class="card"><table><thead><tr><th></th><th>Date</th><th>Charge</th><th>From</th><th class="r">Qty</th><th class="r">Amount</th><th>Status</th></tr></thead><tbody>
${row(0,'02 Oct','Consultation','Dr Meera Rao · Visit #1','EMR','b-blue','1','₹500.00','Paid · RCT-000041','b-green')}
${row(1,'02 Oct','Paracetamol 650','Dispensed against RX-000001','Pharmacy','b-purple','9','₹86.40','Unbilled','b-amber')}
${row(1,'02 Oct','ORS Sachet','Dispensed against RX-000001','Pharmacy','b-purple','3','₹60.00','Unbilled','b-amber')}
${row(1,'02 Oct','CBC (blood test)','Ordered by Dr Meera Rao','EMR','b-blue','1','₹350.00','Unbilled','b-amber')}
${row(0,'02 Oct','Dressing charge','Added manually by front desk','EMR','b-blue','1','₹40.00','Unbilled','b-amber')}</tbody></table></div>
<div class="callout n" style="left:232px;top:600px;max-width:360px">① One list for <b>everything</b> this patient owes — consultation, lab, and (when the pharmacy module is on) the medicines — each tagged with where it came from.</div>
<div class="callout n" style="left:620px;top:600px;max-width:360px">② Pharmacy rows appear only if the pharmacy module is connected. With it off, the bill is simply EMR charges.</div>
</div></div>`;
// 3 — payment modal over bill
S[3]=S[2].replace('</div></div>`','')+``;
S[3]=`${side('p')}<div class="main">${head('Asha Menon','UHID SUN-000001 · 41 yrs · Female',`<button class="btn">+ Add charge</button>`)}<div class="body"><div class="stats"><div class="card stat"><p>Total charges</p><h3>₹1,036</h3></div><div class="card stat"><p>Paid</p><h3>₹500</h3></div><div class="card stat"><p>Balance due</p><h3>₹536.40</h3></div><div class="card stat"><p>Advance held</p><h3>₹0</h3></div></div></div></div>
<div class="overlay"><div class="modal"><h2>Collect payment</h2><div style="color:var(--t2);font-size:12.5px;margin-bottom:14px">Asha Menon · INV-000012 · 3 charges</div>
<div class="sum"><span>Gross</span><span>₹496.40</span></div><div class="sum"><span>Discount</span><span style="color:var(--green)">− ₹0.00</span></div><div class="sum tot"><span>To pay</span><span>₹496.40</span></div>
<div class="two" style="margin-top:14px"><div><span class="lbl">Amount received</span><input class="field" value="₹ 496.40"></div><div><span class="lbl">Discount (optional)</span><input class="field" value="₹ 0"></div></div>
<span class="lbl" style="margin-top:14px">Payment mode</span><div class="chips"><span class="pill on">Cash</span><span class="pill">UPI</span><span class="pill">Card</span><span class="pill">Split</span></div>
<span class="lbl">Reference (UPI id / card last 4)</span><input class="field" placeholder="optional">
<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><button class="btn">Cancel</button><button class="btn p" data-go="4">Collect &amp; print receipt</button></div></div></div>
<div class="callout n" style="left:1010px;top:300px;max-width:250px;z-index:30">Paying <b>less</b> than the total is fine — the rest stays as balance on the account. Pay <b>more</b> and it is kept as an advance.</div>`;

S[4]=`<div class="main" style="background:#e5e7eb">${head('Invoice INV-000012','Printable A4 · same page style as the prescription',`<button class="btn">Back to bill</button><button class="btn p">Print / Save as PDF</button>`)}<div class="body"><div class="paper">
<h1>Sunrise Family Clinic</h1><div style="font-size:12px;color:var(--t2)">12 MG Road, Bengaluru · 080 4455 6677<br>Reg. no. KMC-CL-2291</div><hr>
<div style="display:flex;justify-content:space-between;font-size:13px"><div><b style="font-size:15px">Asha Menon</b><br>SUN-000001 · 41 yrs · Female<br>9000012345</div><div style="text-align:right"><b class="mono">INV-000012</b><br>02 Oct 2026<br><span class="badge b-green">PAID · Cash</span></div></div>
<table style="margin-top:18px"><thead><tr><th>#</th><th>Description</th><th>Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>
<tr><td>1</td><td>Paracetamol 650 <span style="color:var(--t3)">(Pharmacy)</span></td><td>9</td><td class="r">9.60</td><td class="r">86.40</td></tr>
<tr><td>2</td><td>ORS Sachet <span style="color:var(--t3)">(Pharmacy)</span></td><td>3</td><td class="r">20.00</td><td class="r">60.00</td></tr>
<tr><td>3</td><td>CBC (blood test)</td><td>1</td><td class="r">350.00</td><td class="r">350.00</td></tr></tbody></table>
<div style="width:240px;margin:16px 0 0 auto"><div class="sum"><span>Gross</span><span>₹496.40</span></div><div class="sum"><span>Discount</span><span>₹0.00</span></div><div class="sum tot"><span>Paid</span><span>₹496.40</span></div><div class="sum"><span>Balance</span><span>₹0.00</span></div></div>
<div style="margin-top:34px;padding-top:10px;border-top:1px solid #ddd;font-size:11px;color:var(--t2);text-align:center">Receipt RCT-000042 · Thank you · Timings 9–1, 5–8</div></div></div></div>`;
