<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar by module — mock-up</title>
<style>
  :root { --brand:#4682B4; --brand-dark:#3a6fa0; --navy:#172a45; --navy-2:#1f3556; --line:#e5e7eb; --ink:#111827; --muted:#6b7280; --page:#f8fafc; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif; color:var(--ink); background:var(--page); }
  .shell { display:flex; height:100vh; }
  aside { width:248px; background:var(--navy); color:#cbd5e1; display:flex; flex-direction:column; flex-shrink:0; }
  .brand { padding:16px; display:flex; gap:10px; align-items:center; color:#fff; font-weight:700; border-bottom:1px solid #ffffff14; }
  .logo { width:30px; height:30px; border-radius:8px; background:var(--brand); display:grid; place-items:center; }
  nav { flex:1; overflow:auto; padding:10px 8px; }
  .mod { margin-bottom:4px; }
  .mod-head { width:100%; display:flex; align-items:center; gap:10px; padding:9px 10px; border:0; background:transparent; color:#e2e8f0; font:600 13px inherit; border-radius:8px; cursor:pointer; text-align:left; }
  .mod-head:hover { background:var(--navy-2); }
  .mod-head .chev { margin-left:auto; transition:transform .15s; opacity:.7; }
  .mod.open .chev { transform:rotate(90deg); }
  .mod.open > .mod-head { color:#fff; }
  .dot { width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff; }
  .kids { display:none; margin:2px 0 6px 20px; padding-left:10px; border-left:1px solid #ffffff1f; }
  .mod.open .kids { display:block; }
  .kid { display:block; width:100%; text-align:left; border:0; background:transparent; color:#aab6c8; font:500 13px inherit; padding:7px 10px; border-radius:7px; cursor:pointer; }
  .kid:hover { background:var(--navy-2); color:#fff; }
  .kid.active { background:var(--brand); color:#fff; }
  .foot { border-top:1px solid #ffffff14; padding:12px 14px; font-size:13px; color:#fff; }
  .foot small { display:block; color:#94a3b8; margin-top:2px; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .try { background:#fff; border-bottom:1px solid var(--line); padding:12px 24px; display:flex; flex-wrap:wrap; gap:18px; align-items:center; font-size:13px; }
  .try b { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  select { padding:6px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  label.chk { display:flex; gap:6px; align-items:center; }
  .page { padding:28px 32px; overflow:auto; }
  .crumb { color:var(--muted); font-size:13px; margin-bottom:6px; }
  h1 { margin:0 0 18px; font-size:22px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; max-width:760px; }
  .card p { margin:0 0 10px; color:#374151; font-size:14px; line-height:1.5; }
  .note { margin-top:16px; background:#eff6ff; border:1px solid #bfdbfe; color:#1e3a8a; border-radius:10px; padding:12px 14px; font-size:13px; max-width:760px; }
  .empty { color:var(--muted); font-size:13px; padding:8px 10px; }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="logo">✚</div><div>PharmaCare<br><small style="font-weight:400;color:#94a3b8;font-size:11px">v1.0</small></div></div>
    <nav id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main>
    <div class="try">
      <span><b>Mock-up — try it</b></span>
      <span><b>Logged in as</b> <select id="role">
        <option value="admin">Admin (everything)</option>
        <option value="doctor_admin">Doctor + Administrator checkbox</option>
        <option value="doctor">Doctor</option>
        <option value="receptionist">Receptionist</option>
        <option value="cashier">Pharmacy cashier</option>
        <option value="manager">Pharmacy manager</option>
      </select></span>
      <span><b>Modules switched on</b></span>
      <label class="chk"><input type="checkbox" id="m-emr" checked> EMR</label>
      <label class="chk"><input type="checkbox" id="m-pharmacy" checked> Pharmacy</label>
    </div>
    <div class="page">
      <div class="crumb" id="crumb"></div>
      <h1 id="title"></h1>
      <div class="card"><p id="blurb"></p></div>
      <div class="note" id="note"></div>
    </div>
  </main>
</div>

<script>
  // Module → sections. `who` = roles that see the section; Admin sees everything.
  const MODULES = [
    { id: 'emr', name: 'EMR', color: '#0d9488', sections: [
      ['Appointments', ['doctor','receptionist']], ['Calendar', ['doctor','receptionist']],
      ['Patients', ['doctor','receptionist']], ['Clinic Billing', ['doctor','receptionist']],
      ['Doctor Schedules', ['receptionist']], ['Clinic Settings', []] ] },
    { id: 'pharmacy', name: 'Pharmacy', color: '#4682B4', sections: [
      ['Dashboard', ['cashier','manager']], ['Billing', ['cashier','manager']], ['Inventory', ['manager']],
      ['Purchases', ['manager']], ['Customers', ['cashier','manager']], ['Suppliers', ['manager']],
      ['Reports', ['manager']], ['Sch H1 Register', ['manager']] ] },
    { id: 'admin', name: 'Admin', color: '#7c3aed', always: true, sections: [
      ['Team', []], ['Roles & Permissions', []], ['Settings', []], ['Audit Log', []] ] },
  ];
  const ROLES = {
    admin: { name: 'Abinash', label: 'Administrator', isAdmin: true, roles: [] },
    doctor_admin: { name: 'Dr Rao', label: 'Doctor · Administrator', isAdmin: true, roles: ['doctor'] },
    doctor: { name: 'Dr Iyer', label: 'Doctor', isAdmin: false, roles: ['doctor'] },
    receptionist: { name: 'Meena', label: 'Receptionist', isAdmin: false, roles: ['receptionist'] },
    cashier: { name: 'Ravi', label: 'Cashier', isAdmin: false, roles: ['cashier'] },
    manager: { name: 'Sunita', label: 'Pharmacy Manager', isAdmin: false, roles: ['manager'] },
  };
  const state = { module: 'emr', section: 'Calendar' };
  const $ = (id) => document.getElementById(id);

  function visible() {
    const user = ROLES[$('role').value];
    const on = { emr: $('m-emr').checked, pharmacy: $('m-pharmacy').checked };
    return MODULES.map((m) => {
      if (!m.always && !on[m.id]) return null;               // module switched off → gone
      const secs = m.sections.filter(([, who]) => user.isAdmin || who.some((r) => user.roles.includes(r)));
      return secs.length ? { ...m, sections: secs } : null;   // nothing allowed → whole module hidden
    }).filter(Boolean);
  }

  function render() {
    const user = ROLES[$('role').value];
    const mods = visible();
    if (!mods.find((m) => m.id === state.module)) { state.module = mods[0]?.id; state.section = mods[0]?.sections[0][0]; }
    $('nav').innerHTML = mods.map((m) => `
      <div class="mod ${m.id === state.module ? 'open' : ''}">
        <button class="mod-head" data-mod="${m.id}">
          <span class="dot" style="background:${m.color}">${m.name[0]}</span>${m.name}
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div class="kids">${m.sections.map(([s]) => `<button class="kid ${m.id === state.module && s === state.section ? 'active' : ''}" data-mod="${m.id}" data-sec="${s}">${s}</button>`).join('')}</div>
      </div>`).join('') || '<div class="empty">No modules available for this user.</div>';
    $('foot').innerHTML = `${user.name}<small>${user.label}</small>`;
    const m = mods.find((x) => x.id === state.module);
    $('crumb').textContent = m ? `${m.name}  ›  ${state.section}` : '';
    $('title').textContent = state.section || '';
    $('blurb').textContent = m ? `This is the ${state.section} page of the ${m.name} module. Only one module is open at a time; the others stay folded so the sidebar never gets long.` : '';
    $('note').textContent = noteFor(user, mods);
  }

  function noteFor(user, mods) {
    const names = mods.map((m) => m.name).join(' + ') || 'nothing';
    if (user.isAdmin && user.roles.length) return `Doctor + Administrator sees ${names}: the clinical role gives the work screens, the checkbox adds everything else.`;
    if (user.isAdmin) return `Administrator sees ${names}.`;
    return `${user.label} sees only: ${names}. A module with no allowed sections isn't shown at all.`;
  }

  $('nav').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    state.module = b.dataset.mod;
    if (b.dataset.sec) state.section = b.dataset.sec;
    else state.section = visible().find((m) => m.id === state.module).sections[0][0];
    render();
  });
  ['role', 'm-emr', 'm-pharmacy'].forEach((id) => $(id).addEventListener('change', render));
  render();
</script>
</body>
</html>
