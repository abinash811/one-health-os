name: CI

on:
  push:
    # main (deploy branch) + the two short-lived branch prefixes this repo
    # actually uses (docs/04_GIT_WORKFLOW.md: `claude/...` for Claude
    # sessions, `fix/...` for quick human fixes) — so CI runs automatically
    # on every commit to a feature branch, not just after a PR exists.
    # Added Aug 25, 2026, direct request — before this, CI only ran on
    # push-to-main/PR or a manual workflow_dispatch, so a whole session's
    # worth of commits could land with zero automatic CI signal.
    branches: [main, 'claude/**', 'fix/**', 'ccr-*']  # 'ccr-*' = cloud sessions' auto-named branches (added Oct 11, 2026)
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  frontend:
    name: Frontend — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # --legacy-peer-deps is still required, but no longer for eslint or
        # react-day-picker — both were upgraded to their real current
        # majors (eslint 9, @typescript-eslint 8, react-day-picker 10, all
        # of which declare React 19 support). What's left is react-scripts
        # 5.0.1 (Create React App) itself hard-peer-requiring
        # typescript@"^3.2.1 || ^4", while this project is on TypeScript
        # 5.7 — that's baked into CRA, unmaintained since ~2023, and isn't
        # fixable by swapping any single package. Removing this flag for
        # real means migrating off CRA (e.g. to Vite, see docs/22_TECH_RADAR.md)
        # — real, separate, larger work, not a version bump.
        run: npm ci --legacy-peer-deps

      - name: Lint
        # 175 is the real current backlog (see docs/11_TESTING.md), not an
        # aspirational number. Was 68 until Sep 8, 2026, when
        # eslint-plugin-jsx-a11y (already a devDependency, never wired into
        # eslint.config.js) got wired in — that surfaced 108 real,
        # previously-invisible accessibility findings (mostly
        # label-has-associated-control) in one step. Ratchet this down as
        # the backlog is worked through; the goal is 0, this is where "0"
        # would have instantly failed on day one of turning the check on
        # for real.
        # Note: --max-warnings only gates warning-severity findings — any
        # error-severity finding fails the step regardless of this number,
        # so 0 real errors is a hard requirement, not a target.
        # Ratcheted 175 -> 120 Sep 18, 2026: real count had fallen to 118
        # without this ceiling ever following it down, per docs/11_TESTING.md.
        run: npm run lint -- --max-warnings 120

      - name: Test
        run: npm test -- --watchAll=false --passWithNoTests

  backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmacare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmacare_test

      - name: Lint
        run: flake8 . --max-line-length=120 --exclude=venv,migrations/versions,__pycache__

      # Every file in tests/ is an HTTP integration test — it calls a real
      # running backend over requests, not the app object directly. Until
      # today, CI never started that backend or seeded the account those
      # tests log in as, so `pytest` failed before a single test ran (see
      # docs/11_TESTING.md CI STATUS). The two steps below are what a
      # developer running these tests locally already has to do by hand.
      - name: Seed test admin account
        run: python seed_admin.py --email testadmin@pharmacy.com --password admin123 --name "Test Admin"
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmacare_test

      - name: Start backend
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/docs -o /dev/null && exit 0
            sleep 1
          done
          echo "Backend did not become ready in time"; cat /tmp/uvicorn.log; exit 1
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmacare_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 1440

      - name: Test
        run: pytest --tb=short -q
        env:
          REACT_APP_BACKEND_URL: http://localhost:8000

  e2e:
    name: E2E — Playwright (real backend + real browser)
    runs-on: ubuntu-latest

    # Runs the actual app end-to-end — backend, Postgres, and a real
    # Chromium browser driving the built frontend — the same class of check
    # that caught the /reports/dashboard and /analytics/summary bugs on
    # August 22, 2026 (both had passing pytest coverage's sibling endpoint,
    # 200 status, correct field types — everything a unit/API test alone
    # checks — while silently returning wrong data; only running the real
    # app end-to-end surfaced it). Kept as its own job so a flaky browser
    # run never blocks the fast backend/frontend unit jobs from reporting.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmacare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          # This job's installed @playwright/test requires Node 20+ ("You
          # are running Node.js 18.20.8. Playwright requires Node.js 20 or
          # higher" — hit live in CI run #31). Not changing the frontend
          # job's Node 18 — no documented reason found for that pin either
          # way (no package.json engines field), so leaving it as-is rather
          # than changing something unrelated to this fix.
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmacare_test

      - name: Seed test admin account
        working-directory: backend
        run: python seed_admin.py --email testadmin@pharmacy.com --password admin123 --name "Test Admin"
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmacare_test

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/docs -o /dev/null && exit 0
            sleep 1
          done
          echo "Backend did not become ready in time"; cat /tmp/uvicorn.log; exit 1
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmacare_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 1440

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend
        run: |
          BROWSER=none nohup npm start > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:3000 -o /dev/null && exit 0
            sleep 1
          done
          echo "Frontend did not become ready in time"; cat /tmp/frontend.log; exit 1

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_EMAIL: testadmin@pharmacy.com
          E2E_PASSWORD: admin123

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse — performance + a11y + best-practices + SEO
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # Audits a real production build (npm run build + serve -s), not the dev
    # server — the dev server's unminified bundle scores misleadingly low on
    # performance. Only /login is audited: it's the one page reachable with
    # zero auth state, so it's the only page a static Lighthouse run can hit
    # without a puppeteerScript to log in first (see lighthouserc.js). Auditing
    # authenticated pages is real follow-up work, tracked in
    # docs/19_PERFORMANCE.md, not done here.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          DISABLE_ESLINT_PLUGIN: true
          CI: false

      # ubuntu-latest ships Google Chrome preinstalled — chrome-launcher (the
      # library Lighthouse uses to find a browser) auto-detects it with no
      # CHROME_PATH needed. That auto-detect only works on a real CI runner;
      # a sandboxed container without Chrome at a standard path needs
      # CHROME_PATH set explicitly (see docs/19_PERFORMANCE.md).
      - name: Run Lighthouse CI
        run: npx lhci autorun --config=./lighthouserc.js

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci/
          retention-days: 7

  definition-of-done:
    name: Definition of Done — source changes need a matching test change
    runs-on: ubuntu-latest
    # PR-time only, by design — see docs/11_TESTING.md "DEFINITION-OF-DONE CI
    # GATE". There's no meaningful base to diff against on a push/dispatch
    # run, and the PR merge into main is the one point CLAUDE.md's workflow
    # agreement treats as the real confirmation gate anyway.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check source changes have a matching test change
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=50
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files in this PR:"
          echo "$CHANGED"

          EXEMPT_REASON=$(printf '%s\n' "$PR_BODY" | grep -m1 -oP '(?<=^Test-exempt:).*' || true)
          if [ -n "$EXEMPT_REASON" ]; then
            echo "::notice::Test-exempt claimed in PR description — reason:$EXEMPT_REASON"
            exit 0
          fi

          SOURCE_CHANGED=$(printf '%s\n' "$CHANGED" | grep -E '^(backend/(routers|models|utils)/|frontend/src/(pages|components|hooks)/)' | grep -vE '\.(test|spec)\.' || true)
          TEST_CHANGED=$(printf '%s\n' "$CHANGED" | grep -E '(^backend/tests/|^frontend/e2e/|/__tests__/|\.(test|spec)\.(js|jsx|ts|tsx|py)$)' || true)

          if [ -n "$SOURCE_CHANGED" ] && [ -z "$TEST_CHANGED" ]; then
            echo "::error::Source files changed under backend/routers|models|utils or frontend/src/pages|components|hooks, but no test file changed (backend/tests/, frontend/e2e/, __tests__/, or a *.test.*/*.spec.* file)."
            echo "Per CLAUDE.md Manifesto rule 12: every feature, fix, or enhancement ships with the tests that prove it."
            echo "If this PR genuinely needs no new test, add a line 'Test-exempt: <reason>' to the PR description and re-run."
            echo ""
            echo "Source files with no matching test change:"
            echo "$SOURCE_CHANGED"
            exit 1
          fi
          echo "OK — either no watched source file changed, or a matching test file changed alongside it."
